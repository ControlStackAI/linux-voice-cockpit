<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Linux Voice Cockpit</title><desc id="desc">A typed, headless voice control plane connecting browser audio, realtime sessions, and OpenClaw agent tools. Conceptual flow: Microphone to WebRTC session to Tool bridge to OpenClaw agent.</desc><rect width="1200" height="360" rx="16" fill="#0d2028"/><path d="M40 44h28v28H40z M47 51h14v14H47z" fill="#8de4cc" fill-rule="evenodd"/><g font-family="Arial,Helvetica,sans-serif"><text x="85" y="64" fill="#a5bdc4" font-size="13" letter-spacing="2">REALTIME VOICE INFRASTRUCTURE</text><text x="40" y="139" fill="#fcfbf4" font-size="38" font-weight="700">Linux Voice Cockpit</text><text x="40" y="193" fill="#c7d5d7" font-size="23">Voice in.</text><text x="40" y="226" fill="#c7d5d7" font-size="23">Agent control out.</text><text x="40" y="313" fill="#8de4cc" font-size="14">PROTOTYPE  /  MIT</text><rect x="590" y="92" width="248" height="76" rx="9" fill="#152b35" stroke="#37515a"/><text x="608" y="117" fill="#8de4cc" font-size="12">01</text><text x="608" y="145" fill="#f4f4eb" font-size="17">Microphone</text><rect x="862" y="92" width="248" height="76" rx="9" fill="#152b35" stroke="#37515a"/><text x="880" y="117" fill="#8de4cc" font-size="12">02</text><text x="880" y="145" fill="#f4f4eb" font-size="17">WebRTC session</text><rect x="590" y="194" width="248" height="76" rx="9" fill="#152b35" stroke="#37515a"/><text x="608" y="219" fill="#8de4cc" font-size="12">03</text><text x="608" y="247" fill="#f4f4eb" font-size="17">Tool bridge</text><rect x="862" y="194" width="248" height="76" rx="9" fill="#152b35" stroke="#37515a"/><text x="880" y="219" fill="#8de4cc" font-size="12">04</text><text x="880" y="247" fill="#f4f4eb" font-size="17">OpenClaw agent</text><path d="M850 130h8 M714 175v13 M986 175v13 M850 232h8" stroke="#8de4cc" stroke-width="2"/><text x="590" y="313" fill="#a5bdc4" font-size="12" letter-spacing="2">CONCEPTUAL FLOW / NOT A PRODUCT SCREENSHOT</text></g></svg>
