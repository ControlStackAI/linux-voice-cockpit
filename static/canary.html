<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linux Voice Cockpit Canary</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 44rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
      main { display: grid; gap: 1rem; }
      label { display: grid; gap: .25rem; }
      input, button { font: inherit; padding: .65rem; }
      .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
      #status { text-transform: uppercase; font-weight: 700; }
      #detail { min-height: 1.5rem; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>Linux Voice Cockpit Canary</h1>
      <p>This page receives only an ephemeral OpenAI Realtime credential. Durable OpenClaw and provider credentials stay in the local service.</p>
      <label>OpenClaw session
        <input id="session" value="agent:main:project:linux-voice-cockpit" autocomplete="off">
      </label>
      <div class="actions">
        <button id="start" type="button">Start microphone</button>
        <button id="stop" type="button" disabled>Stop and tear down</button>
      </div>
      <p><span id="status">idle</span><br><span id="detail" aria-live="polite"></span></p>
      <label>Steering text
        <input id="steering-text" value="Give me a brief progress update" autocomplete="off">
      </label>
      <div class="actions">
        <button id="steer" type="button">Steer active work</button>
        <button id="cancel" type="button">Cancel active work</button>
      </div>
      <audio id="remote-audio" autoplay></audio>
    </main>
    <script type="module" src="/canary.js"></script>
  </body>
</html>
